name: Build Image

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'benchmarks/superbenchmark/image/**'
      - 'benchmarks/nixl-benchmark/image/**'
      - 'benchmarks/moe-bench/image/**'
  push:
    branches:
      - main
    paths:
      - 'benchmarks/superbenchmark/image/**'
      - 'benchmarks/nixl-benchmark/image/**'
      - 'benchmarks/moe-bench/image/**'
  workflow_dispatch:
    inputs:
      image:
        description: Image to build
        required: true
        default: all
        type: choice
        options:
          - all
          - sbcli
          - nixl-benchmark
          - moe-bench
      push:
        description: Push image to registry
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      version:
        description: Release version for semver image tags, for example v0.1.0
        required: false
        default: ''
      latest:
        description: Tag image as latest
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  detect-images:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select image matrix
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          sbcli='{"image":"sbcli","context":"./benchmarks/superbenchmark/image","image_name":"sbcli"}'
          # One matrix entry per profile (benchmarks/nixl-benchmark/image/profiles/*.env); arm64 profiles
          # build natively on the GitHub-hosted arm64 runner
          nixl_benchmark=""
          for f in benchmarks/nixl-benchmark/image/profiles/*.env; do
            [ -e "$f" ] || continue
            p=$(basename "$f" .env)
            runner=ubuntu-latest
            case "$(benchmarks/nixl-benchmark/image/profile.sh "$p" get PLATFORM)" in *arm64*) runner=ubuntu-24.04-arm ;; esac
            nixl_benchmark="${nixl_benchmark:+$nixl_benchmark,}{\"image\":\"nixl-benchmark\",\"context\":\"./benchmarks/nixl-benchmark/image\",\"image_name\":\"nixl-benchmark\",\"profile\":\"$p\",\"runner\":\"$runner\"}"
          done
          moe_bench='{"image":"moe-bench","context":"./benchmarks/moe-bench/image","image_name":"moe-bench","runner":"ubuntu-24.04-arm"}'
          all_images="[$sbcli,$nixl_benchmark,$moe_bench]"
          sbcli_image="[$sbcli]"
          nixl_benchmark_image="[$nixl_benchmark]"
          moe_bench_image="[$moe_bench]"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.image }}" in
              all) images="$all_images" ;;
              sbcli) images="$sbcli_image" ;;
              nixl-benchmark) images="$nixl_benchmark_image" ;;
              moe-bench) images="$moe_bench_image" ;;
              *) echo "Unsupported image: ${{ inputs.image }}" >&2; exit 1 ;;
            esac
            echo "images=$images" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$head")"
          else
            changed_files="$(git diff --name-only "$base" "$head")"
          fi

          printf 'Changed files:\n%s\n' "$changed_files"

          selected=()
          if printf '%s\n' "$changed_files" | grep -Eq '^benchmarks/superbenchmark/image/'; then
            selected+=("$sbcli")
          fi
          if printf '%s\n' "$changed_files" | grep -Eq '^benchmarks/nixl-benchmark/image/'; then
            selected+=("$nixl_benchmark")
          fi
          if printf '%s\n' "$changed_files" | grep -Eq '^benchmarks/moe-bench/image/'; then
            selected+=("$moe_bench")
          fi
          images="[$(IFS=,; echo "${selected[*]}")]"

          echo "Selected image matrix: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build-image:
    needs: [detect-images]
    if: ${{ needs.detect-images.outputs.images != '[]' }}
    uses: ./.github/workflows/call-build-image.yaml
    with:
      images: ${{ needs.detect-images.outputs.images }}
      push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push == 'true') }}
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      latest: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.latest == 'true') }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
