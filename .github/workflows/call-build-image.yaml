name: Call Build Image

on:
  workflow_call:
    inputs:
      image:
        description: 'Image to build: all, sbcli, or gpu-rdma-bench'
        required: false
        default: all
        type: string
      images:
        description: 'JSON matrix include list for images to build'
        required: false
        default: ''
        type: string
      push:
        description: Push image to registry
        required: false
        default: true
        type: boolean
      version:
        description: Release version for semver image tags, for example v0.1.0
        required: false
        default: ''
        type: string
      latest:
        description: Tag image as latest
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

  ENV_BUILD_TOOLS_IMAGE_NAME: nvidia/cuda:12.8.1-devel-ubuntu22.04
  ENV_BASEIMAGE_FULL_NAME: nvidia/cuda:12.8.1-runtime-ubuntu22.04
  ENV_BASEIMAGE_CUDA_VERISON: 12.8
  ENV_BASEIMAGE_OS_VERISON: ubuntu22.04
  ENV_DEEPEP_VERSION: v1.2.1
  ENV_DEEPGEMM_VERSION: v2.1.1.post3
  ENV_UCX_VERSION: v1.20.0
  ENV_NVSHMEM_VERSION: v3.4.5-0
  ENV_BUILD_AND_DOWNLOAD_PARALLEL: 4
  ENV_TORCH_CUDA_ARCH_LIST: "9.0"
  ENV_NIXL_REPO: https://github.com/ai-dynamo/nixl.git
  ENV_NIXL_REF: main
  ENV_LIBFABRIC_VERSION: v1.21.0
  ENV_ABSL_TAG: lts_2025_08_14
  ENV_GRPC_TAG: v1.73.0

jobs:
  prepare-matrix:
    name: Prepare image matrix
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Select image matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          all_images='[{"image":"sbcli","context":"./benchmarks/superbenchmark/image","image_name":"sbcli"},{"image":"gpu-rdma-bench","context":"./benchmarks/gpu-rdma-bench/image","image_name":"gpu-rdma-bench"}]'
          sbcli_image='[{"image":"sbcli","context":"./benchmarks/superbenchmark/image","image_name":"sbcli"}]'
          gpu_rdma_bench_image='[{"image":"gpu-rdma-bench","context":"./benchmarks/gpu-rdma-bench/image","image_name":"gpu-rdma-bench"}]'

          if [ -n '${{ inputs.images }}' ]; then
            images='${{ inputs.images }}'
          else
            case '${{ inputs.image }}' in
              all) images="$all_images" ;;
              sbcli) images="$sbcli_image" ;;
              gpu-rdma-bench) images="$gpu_rdma_bench_image" ;;
              *) echo "Unsupported image: ${{ inputs.image }}" >&2; exit 1 ;;
            esac
          fi

          echo "images=$images" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build ${{ matrix.image }}
    needs: [prepare-matrix]
    if: ${{ needs.prepare-matrix.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.images) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ inputs.latest }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build sbcli image
        if: ${{ matrix.image == 'sbcli' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gpu-rdma-bench image
        if: ${{ matrix.image == 'gpu-rdma-bench' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENV_BUILD_TOOLS_IMAGE_NAME=${{ env.ENV_BUILD_TOOLS_IMAGE_NAME }}
            ENV_BASEIMAGE_FULL_NAME=${{ env.ENV_BASEIMAGE_FULL_NAME }}
            ENV_BASEIMAGE_CUDA_VERISON=${{ env.ENV_BASEIMAGE_CUDA_VERISON }}
            ENV_BASEIMAGE_OS_VERISON=${{ env.ENV_BASEIMAGE_OS_VERISON }}
            ENV_DEEPEP_VERSION=${{ env.ENV_DEEPEP_VERSION }}
            ENV_DEEPGEMM_VERSION=${{ env.ENV_DEEPGEMM_VERSION }}
            ENV_UCX_VERSION=${{ env.ENV_UCX_VERSION }}
            ENV_NVSHMEM_VERSION=${{ env.ENV_NVSHMEM_VERSION }}
            ENV_BUILD_AND_DOWNLOAD_PARALLEL=${{ env.ENV_BUILD_AND_DOWNLOAD_PARALLEL }}
            ENV_TORCH_CUDA_ARCH_LIST=${{ env.ENV_TORCH_CUDA_ARCH_LIST }}
            ENV_NIXL_REPO=${{ env.ENV_NIXL_REPO }}
            ENV_NIXL_REF=${{ env.ENV_NIXL_REF }}
            ENV_LIBFABRIC_VERSION=${{ env.ENV_LIBFABRIC_VERSION }}
            ENV_ABSL_TAG=${{ env.ENV_ABSL_TAG }}
            ENV_GRPC_TAG=${{ env.ENV_GRPC_TAG }}

  update-release-notes:
    name: Update image release notes
    needs: [prepare-matrix, build-image]
    if: ${{ inputs.push && inputs.version != '' && needs.prepare-matrix.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Add image download info to GitHub release notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.version }}
          IMAGES_JSON: ${{ needs.prepare-matrix.outputs.images }}
          REGISTRY: ${{ env.REGISTRY }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const images = JSON.parse(process.env.IMAGES_JSON || '[]');
            const registryRepo = `${owner}/${repo}`.toLowerCase();
            const marker = 'release-images';
            const semverMatch = tag.match(/^v?(\d+)\.(\d+)\.(\d+)$/);
            const compatTag = semverMatch ? `v${semverMatch[1]}.${semverMatch[2]}` : '';

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                body: '',
                draft: false,
                prerelease: false
              });
            }

            const previousBody = release.data.body || '';
            const start = `<!-- ${marker}:start -->`;
            const end = `<!-- ${marker}:end -->`;
            const escapedStart = start.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const escapedEnd = end.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const sectionPattern = new RegExp(`\\n*${escapedStart}[\\s\\S]*?${escapedEnd}\\n*`, 'g');
            const bodyWithoutOldSection = previousBody.replace(sectionPattern, '\n').trimEnd();

            const lines = [
              start,
              '## Container Image Download',
              '',
              `Registry: \`${process.env.REGISTRY}/${registryRepo}\``,
              '',
              '| Image | Exact tag | Compatibility tag | Pull command |',
              '| --- | --- | --- | --- |'
            ];

            for (const image of images) {
              const imageRef = `${process.env.REGISTRY}/${registryRepo}/${image.image_name}`;
              const compat = compatTag || '-';
              const pull = `docker pull ${imageRef}:${tag}`;
              lines.push(`| ${image.image_name} | \`${tag}\` | \`${compat}\` | \`${pull}\` |`);
            }

            lines.push('');
            lines.push('Use exact release tag for reproducible deployments. Compatibility tag keeps same major.minor line.');
            lines.push(end);

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              body: [bodyWithoutOldSection, lines.join('\n')].filter(Boolean).join('\n\n')
            });
