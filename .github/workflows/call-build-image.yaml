name: Call Build Image

on:
  workflow_call:
    inputs:
      image:
        description: 'Image to build: all, sbcli, nixl-benchmark, or moe-bench'
        required: false
        default: all
        type: string
      images:
        description: 'JSON matrix include list for images to build'
        required: false
        default: ''
        type: string
      push:
        description: Push image to registry
        required: false
        default: true
        type: boolean
      version:
        description: Release version for semver image tags, for example v0.1.0
        required: false
        default: ''
        type: string
      latest:
        description: Tag image as latest
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  prepare-matrix:
    name: Prepare image matrix
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select image matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          sbcli='{"image":"sbcli","context":"./benchmarks/superbenchmark/image","image_name":"sbcli"}'
          # One matrix entry per profile (benchmarks/nixl-benchmark/image/profiles/*.env); arm64 profiles
          # build natively on the GitHub-hosted arm64 runner
          nixl_benchmark=""
          for f in benchmarks/nixl-benchmark/image/profiles/*.env; do
            [ -e "$f" ] || continue
            p=$(basename "$f" .env)
            runner=ubuntu-latest
            case "$(benchmarks/nixl-benchmark/image/profile.sh "$p" get PLATFORM)" in *arm64*) runner=ubuntu-24.04-arm ;; esac
            nixl_benchmark="${nixl_benchmark:+$nixl_benchmark,}{\"image\":\"nixl-benchmark\",\"context\":\"./benchmarks/nixl-benchmark/image\",\"image_name\":\"nixl-benchmark\",\"profile\":\"$p\",\"runner\":\"$runner\"}"
          done
          moe_bench='{"image":"moe-bench","context":"./benchmarks/moe-bench/image","image_name":"moe-bench","runner":"ubuntu-24.04-arm"}'
          all_images="[$sbcli,$nixl_benchmark,$moe_bench]"
          sbcli_image="[$sbcli]"
          nixl_benchmark_image="[$nixl_benchmark]"
          moe_bench_image="[$moe_bench]"

          if [ -n '${{ inputs.images }}' ]; then
            images='${{ inputs.images }}'
          else
            case '${{ inputs.image }}' in
              all) images="$all_images" ;;
              sbcli) images="$sbcli_image" ;;
              nixl-benchmark) images="$nixl_benchmark_image" ;;
              moe-bench) images="$moe_bench_image" ;;
              *) echo "Unsupported image: ${{ inputs.image }}" >&2; exit 1 ;;
            esac
          fi

          echo "images=$images" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build ${{ matrix.image }}${{ matrix.profile && format(' ({0})', matrix.profile) || '' }}
    needs: [prepare-matrix]
    if: ${{ needs.prepare-matrix.outputs.images != '[]' }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    # nixl-benchmark compiles gRPC, UCX, libfabric and NIXL from source
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.images) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ matrix.image == 'moe-bench' }}
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker system prune -af
          df -h /
          # nvcc for DeepEP/DeepGEMM can exhaust the runner's 16GB RAM
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Records memory and disk usage while building; printed after the build.
      - name: Monitor resources
        if: ${{ matrix.image == 'moe-bench' }}
        shell: bash
        run: |
          nohup bash -c 'while true; do date -u +%H:%M:%S; free -h; df -h /; sleep 300; done' >/tmp/resources.log 2>&1 &

      - name: Resolve nixl-benchmark profile
        id: profile
        if: ${{ matrix.image == 'nixl-benchmark' }}
        shell: bash
        run: |
          set -euo pipefail
          sh="${{ matrix.context }}/profile.sh"
          platform="$("$sh" "${{ matrix.profile }}" get PLATFORM)"
          {
            echo "platform=$platform"
            echo "suffix=-${{ matrix.profile }}"
            echo "args<<EOF"
            "$sh" "${{ matrix.profile }}" args
            echo "GIT_COMMIT_VERSION=$(git rev-parse --short HEAD)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "platform: $platform"
          "$sh" "${{ matrix.profile }}" args

      - name: Set up QEMU
        if: ${{ matrix.image == 'sbcli' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          # nixl-benchmark: every tag ends with -<profile>, e.g. latest-cuda13-gb300, 0.1.0-cuda13-x86
          flavor: |
            suffix=${{ steps.profile.outputs.suffix }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ inputs.latest }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      # sbcli is a pure-Python control image; arm64 is needed to drive GB300
      # (Grace) nodes. Built under QEMU on the hosted runner.
      - name: Build sbcli image
        if: ${{ matrix.image == 'sbcli' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nixl-benchmark image
        if: ${{ matrix.image == 'nixl-benchmark' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: ${{ steps.profile.outputs.platform }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nixl-benchmark-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=nixl-benchmark-${{ matrix.profile }}
          build-args: ${{ steps.profile.outputs.args }}

      # moe-bench is ~35GB (NGC PyTorch base), above the 10GB GHA cache limit,
      # so it builds without layer cache. MAX_JOBS=2 keeps nvcc within RAM + swap.
      - name: Build moe-bench image
        if: ${{ matrix.image == 'moe-bench' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MAX_JOBS=2

      - name: Show resource usage
        if: ${{ always() && matrix.image == 'moe-bench' }}
        run: cat /tmp/resources.log || true

  update-release-notes:
    name: Update image release notes
    needs: [prepare-matrix, build-image]
    if: ${{ inputs.push && inputs.version != '' && needs.prepare-matrix.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Add image download info to GitHub release notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.version }}
          IMAGES_JSON: ${{ needs.prepare-matrix.outputs.images }}
          REGISTRY: ${{ env.REGISTRY }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const images = JSON.parse(process.env.IMAGES_JSON || '[]');
            const registryRepo = `${owner}/${repo}`.toLowerCase();
            const marker = 'release-images';
            const semverMatch = tag.match(/^v?(\d+)\.(\d+)\.(\d+)$/);
            const compatTag = semverMatch ? `v${semverMatch[1]}.${semverMatch[2]}` : '';

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                body: '',
                draft: false,
                prerelease: false
              });
            }

            const previousBody = release.data.body || '';
            const start = `<!-- ${marker}:start -->`;
            const end = `<!-- ${marker}:end -->`;
            const escapedStart = start.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const escapedEnd = end.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const sectionPattern = new RegExp(`\\n*${escapedStart}[\\s\\S]*?${escapedEnd}\\n*`, 'g');
            const bodyWithoutOldSection = previousBody.replace(sectionPattern, '\n').trimEnd();

            const lines = [
              start,
              '## Container Image Download',
              '',
              `Registry: \`${process.env.REGISTRY}/${registryRepo}\``,
              '',
              '| Image | Exact tag | Compatibility tag | Pull command |',
              '| --- | --- | --- | --- |'
            ];

            for (const image of images) {
              const imageRef = `${process.env.REGISTRY}/${registryRepo}/${image.image_name}`;
              // Profiled images (nixl-benchmark) carry the profile as a tag suffix
              const suffix = image.profile ? `-${image.profile}` : '';
              const name = image.profile ? `${image.image_name} (${image.profile})` : image.image_name;
              const compat = compatTag ? `${compatTag}${suffix}` : '-';
              const pull = `docker pull ${imageRef}:${tag}${suffix}`;
              lines.push(`| ${name} | \`${tag}${suffix}\` | \`${compat}\` | \`${pull}\` |`);
            }

            lines.push('');
            lines.push('Use exact release tag for reproducible deployments. Compatibility tag keeps same major.minor line.');
            lines.push(end);

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              body: [bodyWithoutOldSection, lines.join('\n')].filter(Boolean).join('\n\n')
            });
