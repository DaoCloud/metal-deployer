# SuperBench multi-node config for GB300: cross-node traffic over InfiniBand.
#
# Works for any host set (same rack or different racks). Cross-tray NVLink (MNNVL) is forced off
# so NCCL uses the IB rails; the NVLink-domain test lives in config_gb300_nvl_domain.yaml.
# Assumes 4 GPUs and 4 IB NICs (ConnectX-8, one 800G port each) per tray, rail-aligned:
# local rank N uses GPU N and the N-th InfiniBand link-layer device; GPU N sits on Grace N/2.
version: v0.13
superbench:
  enable:
  - ib-traffic:perftest:multinode
  - ib-traffic:perftest:multinode-bidir
  - ib-traffic:perftest:multinode-lat
  - nccl-bw:bw:allreduce:ib
  - nccl-bw:bw:allgather:ib
  - nccl-bw:bw:reducescatter:ib
  - nccl-bw:bw:alltoall:ib
  monitor:
    enable: true
    sample_duration: 1
    sample_interval: 10
  var:
    default_timeout: 600
    mpi_mca: &mpi_mca
      pml: ob1
      btl: ^openib
      btl_tcp_if_exclude: lo,docker0
      coll_hcoll_enable: 0
      plm_rsh_args: >-
        "-F /root/.ssh/config -i /root/.ssh/key"
    ib_traffic_mode: &ib_traffic_mode
      name: mpi
      proc_num: 4
      node_num: all
      env:
        PATH: null
        LD_LIBRARY_PATH: null
        SB_MICRO_PATH: null
        SB_WORKSPACE: null
      mca: *mpi_mca
    # set_ib_devices picks the InfiniBand link-layer devices in name order (Ethernet BF3 ports are
    # skipped); gpu_dev/numa_dev are expanded per rank by the shell inside ib_validation.
    ib_traffic_param: &ib_traffic_param
      iters: 5000
      msg_size: 8388608
      command:
      - ib_write_bw
      pattern: one-to-one
      set_ib_devices: true
      gpu_dev: $LOCAL_RANK
      numa_dev: $((LOCAL_RANK/2))
    nccl_ib_mode: &nccl_ib_mode
      name: mpi
      proc_num: 4
      node_num: all
      env:
        NCCL_DEBUG: INFO
        NCCL_MNNVL_ENABLE: '0'
        NCCL_NVLS_ENABLE: '0'
        PATH: null
        LD_LIBRARY_PATH: null
        SB_MICRO_PATH: null
        SB_WORKSPACE: null
      mca: *mpi_mca
    nccl_param: &nccl_param
      minbytes: 1
      maxbytes: 16G
      stepfactor: 2
      check: 1
      warmup_iters: 20
      iters: 100
      ngpus: 1
      in_place: true
  benchmarks:
    # GPU Direct RDMA (gpu-to-gpu) is the acceptance item; cpu-to-cpu is kept as a baseline.
    ib-traffic:perftest:multinode:
      timeout: 6000
      modes:
      - *ib_traffic_mode
      parameters:
        <<: *ib_traffic_param
        direction:
        - gpu-to-gpu
        - cpu-to-cpu
    ib-traffic:perftest:multinode-bidir:
      timeout: 6000
      modes:
      - *ib_traffic_mode
      parameters:
        <<: *ib_traffic_param
        bidirectional: true
        direction:
        - gpu-to-gpu
    # msg_size is shared by every command in one entry, so latency needs its own entry: with the 8 MiB
    # bandwidth size, ib_write_lat would mostly measure transfer time instead of network latency.
    # ib_validation only reports t_avg (no t_typical or percentiles).
    ib-traffic:perftest:multinode-lat:
      timeout: 6000
      modes:
      - *ib_traffic_mode
      parameters:
        <<: *ib_traffic_param
        command:
        - ib_write_lat
        msg_size: 2
        iters: 20000
        direction:
        - cpu-to-cpu
    nccl-bw:bw:allreduce:ib:
      timeout: 600
      modes:
      - *nccl_ib_mode
      parameters:
        <<: *nccl_param
        operation: allreduce
        data_type: half
    nccl-bw:bw:allgather:ib:
      timeout: 600
      modes:
      - *nccl_ib_mode
      parameters:
        <<: *nccl_param
        operation: allgather
    nccl-bw:bw:reducescatter:ib:
      timeout: 600
      modes:
      - *nccl_ib_mode
      parameters:
        <<: *nccl_param
        operation: reducescatter
        data_type: half
    nccl-bw:bw:alltoall:ib:
      timeout: 600
      modes:
      - *nccl_ib_mode
      parameters:
        <<: *nccl_param
        operation: alltoall
        data_type: half
