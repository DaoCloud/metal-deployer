# SuperBench result summary rules for the GB300 configs (config_gb300_*.yaml).
version: v0.8
superbench:
  rules:
    gpu-compute:
      statistics:
        - mean
        - min
        - max
      categories: GPU-COMPUTE
      aggregate: True
      metrics:
        - cublaslt-gemm:compute/.+_flops
        - cublaslt-gemm:fp4/.+_flops
    gpu-copy:
      statistics:
        - mean
        - min
        - max
      categories: GPU-MEM
      aggregate: True
      metrics:
        - nvbandwidth/.+_sum_.+
        - gpu-copy-bw:perf/.+_bw
    gpu-burn:
      statistics:
        - mean
        - max
      categories: GPU-STABILITY
      aggregate: True
      metrics:
        - gpu-burn/.*
    cpu-stream:
      statistics:
        - mean
        - min
        - max
      categories: CPU-MEM
      aggregate: True
      metrics:
        - cpu-stream:.*/.+_throughput
    ib-loopback:
      statistics:
        - mean
        - min
        - max
      categories: RDMA-LOCAL
      aggregate: True
      metrics:
        - ib-loopback:1G/.*(Avg|BW|Gbps|Mpps).*
    ib-traffic:
      statistics:
        - mean
        - min
        - max
      categories: RDMA-MULTINODE
      aggregate: True
      metrics:
        - ib-traffic:perftest:multinode.*/.*(bw|lat|msg_rate|Gbps|Mpps).*
    nccl-nvlink:
      statistics:
        - mean
        - min
        - max
      categories: NCCL-NVLINK
      aggregate: True
      metrics:
        - nccl-bw:bw:.+:nvlink/.+
    nccl-mnnvl:
      statistics:
        - mean
        - min
        - max
      categories: NCCL-MNNVL
      aggregate: True
      metrics:
        - nccl-bw:bw:.+:mnnvl(-nvls)?/.+
    nccl-mnnvl-ib:
      statistics:
        - mean
        - min
        - max
      categories: NCCL-MNNVL-IB
      aggregate: True
      metrics:
        - nccl-bw:(bw|soak):.+:mnnvl-ib/.+
    nccl-ib:
      statistics:
        - mean
        - min
        - max
      categories: NCCL-IB
      aggregate: True
      metrics:
        - nccl-bw:bw:.+:ib/.+
    disk:
      statistics:
        - mean
        - min
        - max
      categories: DISK
      aggregate: True
      metrics:
        - disk-benchmark/.*(bw|iops|lat|clat|slat).*
