# mtest tests file: which tests to run, on which hosts, and how.
#
# Items run in this built-in order; only "enabled: true" items run:
#   smoke -> dcgm -> superbench.single_node -> superbench.disk -> superbench.pair -> superbench.rack
#   -> superbench.all -> imex -> superbench.nvl_domain -> sharp.scale_up -> sharp.scale_out
#   -> moe.single -> moe.rack -> moe.cross_rack -> moe.all -> moe.moonep
#
# Host selection (hosts / groups): all | R1 | gb300-r1-t01 | tag:batch1, or a list of them.
# scope: node  = one group per host
#        rack  = one group per rack
#        group = all selected hosts in one group (or list several groups under "groups")
#
# Template variables, rendered per node at run time:
#   group: {run_id} {group_id} {node_rank} {nnodes} {master_addr} {master_port} {node_list} {rack_list}
#          {np} (GPUs in the group) {hostfile} (MPI hostfile in mpi mode)
#   host:  {hostname} {rack} {tray} {gpus} {mgmt_ip} {storage_ip} {ib0_ip}..{ib3_ip}
#   S3:    {mgmt_if} {ib_hcas} {ib_ucx_devs}   (filled from "mtest nic discover" results)
# Environment layers, later ones win:
#   common_env -> <section>.common.env -> <item>.env -> <section>.common.per_rank -> host env in cluster.yaml
version: 1

images:                           # tag or tag@digest; the digest actually used is recorded in results
  dcgm: nvcr.io/nvidia/cloud-native/dcgm:4.7.1-ubuntu24.04   # same DCGM version as the ISO
  sbcli: registry.local/metal-deployer/testkit:latest
  sb_worker: superbench/main:cuda13.0
  moe_bench: registry.local/metal-deployer/moe-bench:latest
image_pull: registry              # registry: hosts pull; push: copy over ssh (docker save | load); skip: only check

runtime:
  results_dir: ./runs             # local results, relative to this file
  node_results_dir: /var/lib/testkit/runs     # on each host, mounted as /results in test containers
  container_args: [--gpus, all, --network, host, --ipc, host, --privileged,
                   --ulimit, memlock=-1, --ulimit, stack=67108864, --shm-size, 64g]
  master_port_base: 29500         # MASTER_PORT = base + group index
  mpi_ssh_port: 2222              # sshd port inside containers in mpi mode
  rendezvous_timeout: 600         # seconds
  run_timeout: 7200               # seconds, per group
  poll_interval: 3                # seconds between container status checks
  stop_on_failure: true           # hosts that failed an item do not run later items
  group_order: serial             # serial / parallel

common_env:                       # injected into every test container
  NCCL_SOCKET_IFNAME: "{mgmt_if}"
  GLOO_SOCKET_IFNAME: "{mgmt_if}"
  NCCL_IB_HCA: "{ib_hcas}"
  UCX_NET_DEVICES: "{ib_ucx_devs}"

# ---------------- smoke ----------------
smoke:                            # start one container per host and write summary.json: checks SSH, Docker and the image
  enabled: false
  scope: node
  hosts: all
  image: sb_worker
  mode: per-node                  # per-node / mpi / delegate; mpi runs "mpirun hostname" across the group
  sleep: 0                        # seconds the container waits before finishing
  exit_code: 0                    # exit code to return; set MTEST_SMOKE_EXIT in a host env to fail one host

# ---------------- S5 DCGM ----------------
dcgm:
  enabled: true
  scope: node
  hosts: all
  level: 3                        # dcgmi diag -r 3; 4 is the long run
  hostengine: container           # container: run nv-hostengine and the diag plugins of the image; the host
                                  #            nvidia-dcgm service is stopped during the test, started again after
                                  # host: use the host's nvidia-dcgm service (port 5555) and its DCGM install
  health: true
  checks: [ecc, remapped_rows, nvlink, fabric_state]
  gpu_burn: {enabled: false, seconds: 600}

# ---------------- S6 SuperBench ----------------
superbench:
  # The sbcli image (images.sbcli) runs on the rank 0 host of each group and drives every host of the
  # group with sb deploy/run; images.sb_worker must already be on every host. A key made for the run is
  # added to the hosts' authorized_keys and removed afterwards.
  common:
    rule: rule_gb300.yaml
    config_dir: ""                # where configs are in the sbcli image (empty: /workspace)
    timeout: 14400                # seconds per group; overrides runtime.run_timeout
    benchmarks: {include: [], exclude: []}    # empty include = every benchmark enabled in the config

  single_node:                    # SB-1: GEMM, GPU memory, gpu-burn, cpu-stream, ib-loopback, NCCL in node
    enabled: true
    scope: node
    hosts: all
    config: config_gb300_single_node.yaml

  disk:                           # overwrites the selected disks; implemented in a later phase
    enabled: false
    scope: node
    hosts: all
    config: config_gb300_disk.yaml
    selector: {model: "", size_gb: 3840}
    exclude_by_id: []
    expected_count: 8
    parallel: false

  pair:                           # SB-2: two-host IB smoke test
    enabled: true
    scope: group
    hosts: [gb300-r1-t01, gb300-r1-t02]
    config: config_gb300_multi_node.yaml

  rack:                           # SB-3: IB inside each rack
    enabled: true
    scope: rack
    hosts: all
    config: config_gb300_multi_node.yaml

  all:                            # SB-4: IB across all hosts; ib-traffic covers every host pair
    enabled: false
    scope: group
    hosts: all
    config: config_gb300_multi_node.yaml

  nvl_domain:                     # S7: collectives over MNNVL inside each rack; runs after imex
    enabled: true
    scope: rack
    hosts: all
    config: config_gb300_nvl_domain.yaml

# ---------------- S7 IMEX ----------------
imex:
  enabled: true
  scope: rack                     # one IMEX domain per rack
  hosts: all
  configure: true                 # imex-configure.sh on every host with the rack's mgmt IPs (rank order)
  scripts_dir: /opt/resource/scripts   # imex-configure.sh / imex-check.sh installed by the ISO
  wait_ready_seconds: 300         # wait for nvidia-imex-ctl -N "Domain State: UP"
  bench:                          # in mpi-mode containers (images.sb_worker)
    t1_fabric_ipc: true           # imex_fabric_ipc_test, compiled with mpicc in each container
    t2_nvbandwidth: true          # skipped when nvbandwidth was built without MULTINODE=1
    nvbandwidth: ""               # path of a multinode nvbandwidth in the image (empty: /opt/superbench/bin/nvbandwidth)

# ---------------- S7a SHARP ----------------
# SuperBench nccl-bw from config_gb300_sharp.yaml; each case is one NCCL setting defined there:
#   U-A NVLS off, U-B NVLink SHARP (inside a rack); O-A off, O-B NVLS + IB, O-C IB SHARP, O-D both (racks).
# Comparisons (U-B/U-A, O-D/O-B, ...) are shown in the report, not judged.
sharp:
  common:
    config: config_gb300_sharp.yaml
    ops: [allreduce, reducescatter, allgather]
    worker_image: ""              # empty: images.sb_worker; or an image with a newer NCCL
    timeout: 14400
  scale_up:                       # NVLink SHARP inside a rack; needs imex
    enabled: true
    scope: rack
    hosts: all
    cases: [U-A, U-B]
  scale_out:                      # IB SHARP across racks; needs >= 2 racks and SHARP AM in UFM
    enabled: false
    scope: group
    groups: [[R1, R2]]
    cases: [O-A, O-B, O-C, O-D]

# ---------------- S8 MoE ----------------
moe:
  common:
    image: moe_bench
    env:
      WORLD_SIZE: "{nnodes}"
      RANK: "{node_rank}"
      MASTER_ADDR: "{master_addr}"
      MASTER_PORT: "{master_port}"
      HIDDEN_DIM: "7168"
      NUM_TOKENS_PER_RANK: "4096"
      NUM_LOCAL_EXPERTS: "8"
      TOPK: "8"
    cmd: [moe-bench, --log-dir, /results]
    per_rank: {}                  # per group rank, for example {"0": {env: {...}, args_append: [...]}}

  single:                         # L1: one host, HybridEP + DeepGEMM
    enabled: true
    scope: node
    hosts: all
    args: [--suite, all]

  rack:                           # L2: inside a rack over MNNVL; needs imex
    enabled: true
    scope: rack
    hosts: all
    args: [--suite, hybrid-ep]

  cross_rack:                     # L3: NVLink inside a rack, IB across racks
    enabled: false
    scope: group
    groups: [[R1, R2]]
    args: [--suite, hybrid-ep]
    env: {NUM_TOKENS_PER_RANK: "2048"}

  all:                            # L4: all hosts in one group
    enabled: false
    scope: group
    hosts: all
    args: [--suite, hybrid-ep]

  moonep:                         # not integrated yet
    enabled: false
    scope: node
    hosts: all

# ---------------- S9 report ----------------
report:
  title: GB300 测试报告
  formats: [html, csv]            # html: report.html (single file, works offline); csv: hosts.csv, metrics.csv
