[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "metal-testkit"
version = "0.1.0"
description = "testkit: run GB300 acceptance tests on many nodes over SSH and build an HTML report"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["PyYAML>=5.1"]

[project.scripts]
testkit = "testkit.cli:main"

[tool.setuptools.packages.find]
include = ["testkit*"]

[tool.setuptools.package-data]
testkit = ["templates/*", "templates/*/*", "node_scripts/*", "report/*"]
