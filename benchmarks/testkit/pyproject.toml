[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "metal-testkit"
version = "0.1.0"
description = "mtest: run GB300 acceptance tests on many nodes over SSH and build an HTML report"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["PyYAML>=5.1"]

[project.scripts]
mtest = "mtest.cli:main"

[tool.setuptools.packages.find]
include = ["mtest*"]

[tool.setuptools.package-data]
mtest = ["templates/*", "node_scripts/*", "report/*"]
