# testkit cluster file: how to reach the hosts, network parameters, and the host list.
# Values that differ per host go under hosts; values shared by every host go elsewhere.

ssh:
  user: root
  key: ~/.ssh/id_ed25519          # private key used to log in to every host over its LOM address
  port: 22
  parallel: 24                    # max hosts operated on at the same time
  connect_timeout: 10             # seconds
  options: []                     # extra "ssh -o" options, for example [ProxyJump=jump01]

# Network parameters for S3 (testkit nic discover) and S4 (testkit net apply).
# Not needed when the host network is already configured and you only run tests.
network:
  # Hardware profile; it fills in expect, mgmt and storage below, and keys written here win.
  #   gb300   BF3 port 0 = mgmt, port 1 = storage; 4x ConnectX-8 (15b3:1023) rails on InfiniBand
  #   custom  nothing assumed: set expect, and mgmt/storage device: nic (found by mgmt_pci /
  #           storage_pci) or mgmt device: lom (the mgmt address is the LOM address, S4 leaves it)
  profile: gb300
  expect:
    gpus: 4
    cx8: {count: 4, pci_id: "15b3:1023", link_layer: InfiniBand, rate_gbps: 800}   # compute NICs (rails)
    bf3: {pf_count: 2, pci_id: "15b3:a2dc", mode: nic}
    compare_golden: true          # compare the GPU <-> rail mapping with the golden host
  ib_mode: {enforce: true, reboot: ask}      # reboot: ask / auto / never
  # When the default route moves to mgmt, replies from the (static) LOM address use policy routing
  # table "table": LOM subnet + default via the LOM gateway. The LOM default route in the main table
  # is moved into that table, so every network that reaches the host over the LOM keeps working.
  lom:
    table: 100
    priority: 100                 # priority of the "from <LOM address> lookup <table>" rule
  # mtu is optional: when omitted the port MTU is not changed.
  # gateway / routes here are defaults; mgmt_gateway, storage_gateway, storage_routes on a host win.
  mgmt: {device: bf3, port: 0, gateway: 10.20.0.1, dns: [10.20.0.53], default_route: true}
  storage: {device: bf3, port: 1, routes: [10.30.0.0/16]}
  ipoib: {mtu: 4092, pkey: "0x7fff"}   # IPoIB MTU (a host's ib_mtu wins); only partition 0x7fff
  require_pci: true               # find each port by the PCI address in hosts (mgmt_pci, storage_pci, ib_pci);
                                  # false: BF3 .0 = mgmt, .1 = storage, rails in GPU order
  match_by: mac                   # how netplan finds the mgmt/storage ports: mac (permanent MAC) or name (netdev)
  rollback_seconds: 120           # restore the old netplan if the host is unreachable after apply
  verify: {ping_gateway: true, ping_peer_in_rack: true}

defaults:                         # inherited by every host, can be overridden per host
  gpus: 4
  tags: []
  env: {}

# One entry per host. rack + tray decide the rank order in multi-node tests.
#   ssh      LOM address used by testkit
#   mgmt     management network address (CIDR): BF3 port 0 on gb300; also used as MASTER_ADDR
#   storage  storage network address (CIDR): BF3 port 1 on gb300; optional
#   ib       IPoIB address per rail 0..3 (CIDR), optional; the same rail must be in the same subnet
#   Optional, usually filled by "testkit import <ip-plan.xlsx|csv>":
#   mgmt_pci, storage_pci       PCI address of the mgmt / storage port, quoted: "0009:01:00.0"
#   ib_pci, ib_guid             per rail 0..3; ib_pci is needed when ib or ib_mtu is set
#   ib_mtu                      IPoIB MTU of this host
#   mgmt_gateway, storage_gateway, storage_routes, lom_gateway, mgmt_mac, storage_mac
#   tags     golden = reference host; other tags are free-form groups, selected with tag:<name>
#   env      extra environment variables for tests on this host only
#   skip     test items (or prefixes such as moe) this host does not run
hosts:
__HOSTS__
