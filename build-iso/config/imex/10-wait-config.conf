# Installed by nvidia_setup.sh as
#   /etc/systemd/system/nvidia-imex.service.d/10-wait-config.conf
#
# nvidia-imex needs the IMEX domain node list before it can start. The ISO
# cannot know the management IPs of the other NVL72 compute trays, so the
# service is enabled at first boot but stays a no-op until
# /etc/nvidia-imex/nodes_config.cfg exists (written by imex-configure.sh).
[Unit]
ConditionPathExists=/etc/nvidia-imex/nodes_config.cfg
