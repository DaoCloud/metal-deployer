      # -----------------------------------------------------------------------
      # GPU driver: Canonical signed R580 server-open 580.178.04 (ports.ubuntu.com
      # noble-updates restricted/multiverse). Same upstream version as DGX OS
      # 7.6.0, and the exact path Canonical documents for GB200/GB300
      # (`ubuntu-drivers install --gpgpu nvidia:580-server-open`).
      #   + kernel modules prebuilt and signed for 7.0.0-1024-nvidia-64k -> no
      #     DKMS build on first boot, works with Secure Boot enabled
      #   + headless set: no X11 / libnvidia-gl / nvidia-settings
      # Closure resolved with apt-cache depends --no-recommends (arm64) on
      # 2026-11-03; 15 debs, ~170 MB. Do NOT also ship the NVIDIA local-repo
      # deb: its "-1ubuntu1" revision sorts higher than "-0ubuntu0.24.04.1" and
      # apt would silently prefer the unsigned DKMS build.
      # -----------------------------------------------------------------------
      - name: nvidia-headless-no-dkms-580-server-open
        description: R580 server-open headless 元包（无 DKMS、无 X11,Canonical 签名路径入口）
