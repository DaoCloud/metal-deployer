    # =========================================================================
    # cuda13-gb300-aggressive — aggressive fallback stack (NOT DGX OS aligned)
    # =========================================================================
    # Backup ISO for when a performance feature or bug fix needs a newer stack
    # than DGX OS 7.6.0. Same install flow as cuda13-gb300 (Canonical signed
    # modules, no DKMS for the GPU driver, Secure Boot OK); only versions move.
    # Versions checked against the upstream repos on 2026-11-09:
    #
    #   Component        cuda13-gb300           cuda13-gb300-aggressive        Note
    #   Kernel           7.0.0-1024-nvidia-64k  7.0.0-1025-nvidia-64k    current noble-updates
    #   GPU driver       580.178.04 LTSB        615.71.09 NFB            Canonical signed for 1025; NVIDIA 615.71.10 not yet in Ubuntu
    #   CUDA toolkit     13.0.3                 13.4.3                   13.4 pairs with R615; local repo bundles no driver
    #   NCCL             2.31.2                 2.32.3 (+cuda13.4)
    #   cuDNN            9.24.0                 9.28.1
    #   DCGM             4.7.1                  4.8.0
    #   DOCA-OFED        3.2.3 LTS              3.5.0 (MFT 4.37, mlnx-ofed-kernel 2607)  not LTS
    #   Container Toolkit 1.20.0                1.20.1
    #   GDS tools        1.15 (13-0)            1.19.1 (13-4)
    #   Docker / GDRCopy / DGX tuning / SuperBench: unchanged (basic)
    #
    # Why not R620 + CUDA 13.5: R620 is the new LTSB (2026-11-04) but Ubuntu
    # has no signed linux-modules-nvidia-620-server-open-nvidia-64k yet, so it
    # would need DKMS + MOK. Switch this profile once Canonical publishes it.
    # R615 is a New Feature Branch: short support window, keep as backup only.
    #
    # Build (separate work dir keeps the default GB300 caches intact):
    #   CI_WORK_DIR=$PWD/build-iso/.ci-work/gb300-aggressive CACHE_BASE_DIR=$PWD/build-iso/.ci-work/gb300-cache \
    #     make prepare-iso ISO_MANIFEST=build-iso/manifests/manifest-gb300.yaml CUDA_PROFILE=cuda13-gb300-aggressive
    #   sudo CI_WORK_DIR=$PWD/build-iso/.ci-work/gb300-aggressive \
    #     make build-iso ISO_MANIFEST=build-iso/manifests/manifest-gb300.yaml CUDA_PROFILE=cuda13-gb300-aggressive
    cuda13-gb300-aggressive:
      install_environment:
        CUDA_PROFILE: cuda13-gb300-aggressive
        CUDA_TOOLKIT_PACKAGE: cuda-toolkit-13-4
        KERNEL_RELEASE: 7.0.0-1025-nvidia-64k
        NVIDIA_DRIVER_BRANCH: 615-server-open-signed
        NVIDIA_DRIVER_VERSION: 615.71.09
        NVIDIA_DRIVER_FLAVOR: open
        NVIDIA_DRIVER_PKG_SUFFIX: 0ubuntu0.24.04.2
        NVIDIA_DRIVER_PACKAGES: nvidia-headless-no-dkms-615-server-open nvidia-utils-615-server linux-modules-nvidia-615-server-open-nvidia-64k-hwe-24.04 nvidia-fabricmanager-615 libnvidia-nscq-615 nvidia-imex-615 nvidia-modprobe
