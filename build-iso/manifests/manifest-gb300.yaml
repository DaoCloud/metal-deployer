  docker_images:
  # Offline container payload. All images below verified multi-arch (arm64)
  # via `skopeo inspect --raw` on 2026-11-03. Sizes are arm64 compressed;
  # `docker save` output is roughly 2x. prepare.sh pulls with --platform from
  # docker_images[].platform (and by .digest when set) and skips download: false.
  #
  # Role of hpc-benchmarks: NVIDIA-maintained HPC-X / UCX / NCCL / nccl-tests
  # / HPL / HPCG stack for arm64. DGX OS does not ship HPC-X on the host; the
  # NGC container is the supported delivery path. It is NOT required for basic
  # nccl-tests validation (nccl-tests are built on the host against libnccl-dev
  # + Ubuntu openmpi; NCCL carries its own IB/NVLink transport). Enable it only
  # for SHARP in-network reduction or HPL/HPCG acceptance runs.
  - name: hpc-benchmarks
    description: NGC HPC-Benchmarks 25.09（HPC-X 2.24.1, NCCL 2.27.7, CUDA 13.0.1, nccl-tests/HPL/HPCG；arm64 约 6.0 GB 压缩,匹配 R580/CUDA 13.0 宿主机；默认不打包,SHARP/HPL 验收时开启）
    image: nvcr.io/nvidia/hpc-benchmarks:25.09
    platform: linux/arm64
    filename: images/nvidia-hpc-benchmarks-25.09-arm64.tar
    required: false
    download: false
  # SuperBench: the v0.12.0 release (2025-08) has no CC 10.3 entry in
  # gemm-flops and builds no sm_103 code, so it is not usable on GB300. The
  # main-branch CUDA 13.0 image is used instead, pinned by digest because the
  # tag is rebuilt on every push to main:
  #   source   : microsoft/superbenchmark main @ 9142bdfe (CI run 41276177350, 2026-11-01)
  #   index    : sha256:7d2acaabb4773f79eb040d0c0ad4e1726d47b5aa7bbe38b75fb42d608119c80d
  #   arm64    : sha256:3828087ecb299adb72538a2e8abd7a759b7a0170df261cda397f730bfbedadd4
  #   base     : nvcr.io/nvidia/pytorch:25.08-py3, CUDA 13.0, NCCL 2.27.7, HPC-X 2.24.1
  #   GB300    : sm_103 built for in-tree CUDA benchmarks (cuda_common.cmake),
  #              CUTLASS v4.1.0 (100;103), nvbench (100;103), MSCCL (100 103)
  # Known GB300 gaps in this image:
  #   - gemm-flops maps CC 10.3 to the Ampere (CC 8.0) CUTLASS kernels; results
  #     are far below Blackwell peak. Real SM103a FP8/NVFP4 kernels arrive with
  #     microsoft/superbenchmark#883 (open). Use cublaslt-gemm for peak FLOPS.
  #   - cpu-memory-bw-latency (Intel MLC) and cpu-hpl (AOCC/BLIS) are amd64-only.
  #   - cuda bandwidthTest is not built for CUDA >= 12.9; use nvbandwidth.
  # Pulled straight from Docker Hub: docker.m.daocloud.io only proxies
  # allow-listed repos and docker.io/superbench/main is not on that list
  # (only superbench/superbench is). The ISO build host needs Docker Hub access.
  - name: superbench
    description: SuperBench main（CUDA 13.0,arm64,按 digest 固定；支持 GB300 sm_103。gemm-flops 在 GB300 上仅为 Ampere kernel,数值不代表峰值；arm64 约 16 GB 压缩）
    image: docker.io/superbench/main:cuda13.0
    digest: sha256:7d2acaabb4773f79eb040d0c0ad4e1726d47b5aa7bbe38b75fb42d608119c80d
    platform: linux/arm64
    filename: images/superbench-main-cuda13.0-9142bdfe-arm64.tar
    required: false
  runtime_config:
    ssh:
      authorized_keys_file: config/ssh_authorized_keys
      install_users:
      - admin
      - root
      generate_node_private_key: false
    rdma:
      modules_file: config/rdma_modules.conf
      modules:
      - ib_core
      - ib_uverbs
      - ib_umad
      - ib_ipoib
      - rdma_cm
      - iw_cm
      - mlx5_core
      - mlx5_ib
    # Multi-node NVLink (IMEX). The ISO installs nvidia-imex and prepares the
    # host, but the daemon only starts once the per-rack node list exists:
    # Day-2 run `imex-configure.sh --nodes <rack.list>` on every tray.
    imex:
      systemd_dropin: config/imex/10-wait-config.conf
      nodes_config_example: config/imex/nodes_config.cfg.example
      modprobe_options: options nvidia NVreg_CreateImexChannel0=1
      server_port: 50000
      cmd_port: 50005
      nodes_per_domain: 18
      start_on_first_boot: false
      fabric_manager_on_node: false
