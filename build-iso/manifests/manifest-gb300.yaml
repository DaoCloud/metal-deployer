      exclude_packages:
      - linux-image-7.0.0-1024-nvidia-64k
      - linux-modules-7.0.0-1024-nvidia-64k
      - linux-headers-7.0.0-1024-nvidia-64k
      - linux-nvidia-7.0-headers-7.0.0-1024
      - linux-modules-nvidia-fs-7.0.0-1024-nvidia-64k
      - linux-tools-7.0.0-1024-nvidia-64k
      - linux-nvidia-7.0-tools-7.0.0-1024
