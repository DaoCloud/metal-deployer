        # init_system.sh needs a new branch value: install NVIDIA_DRIVER_PACKAGES
        # verbatim, no DKMS, no cuda-drivers metapackage.
        NVIDIA_DRIVER_BRANCH: 580-server-open-signed
        NVIDIA_DRIVER_VERSION: 580.178.04
        NVIDIA_DRIVER_FLAVOR: open
        NVIDIA_DRIVER_PKG_SUFFIX: 0ubuntu0.24.04.1
        NVIDIA_DRIVER_PACKAGES: nvidia-headless-no-dkms-580-server-open nvidia-utils-580-server linux-modules-nvidia-580-server-open-nvidia-64k-hwe-24.04 nvidia-fabricmanager-580 libnvidia-nscq-580 nvidia-imex-580 nvidia-modprobe
