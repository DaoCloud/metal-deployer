        required: false
        filename: nvidia-driver-local-repo-ubuntu2404-580.178.04_1.0-1_arm64.deb
        install_method: apt
      # CUDA 13.0 Update 3 local repo. Bundled driver is 580.126.20 — lower than
      # 580.178.04 so apt never picks it; still pin cuda-drivers/nvidia-driver-580*
      # to avoid the proprietary flavour if someone installs the `cuda` metapackage.
      - name: cuda-toolkit
