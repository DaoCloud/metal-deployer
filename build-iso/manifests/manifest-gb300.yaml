  # Intentionally NOT shipped from DGX OS arm64 "common" (verified 2026-11-05):
  #   nvidia-enable-journaling 20.06 : postinst runs `tune2fs -o journal_data` on /,
  #                                    roughly halves root-fs write throughput; and
  #                                    init_system.sh installs every deb in packages/,
  #                                    so it cannot be shipped as opt-in.
  #   nvidia-pci-no-realloc 24.10    : calls plat_needs_pci_no_realloc, removed from
  #                                    nv-common-apis 26.08 -> no-op; pci=realloc is now
  #                                    handled by nvidia-grub-params via plat_get_pci_realloc.
  #   nvidia-mstflint-loader 23.03   : only modprobes mstflint-access; no arm64 module
  #                                    source (no mstflint-dkms on ports, DOCA ships
  #                                    kernel-mft-dkms/mst_pci) -> systemd-modules-load
  #                                    would fail. Firmware tooling comes from DOCA `mft`.
  #   nvidia-mlnx-tools 23.04        : Conflicts: mlnx-tools, which DOCA-OFED installs.
  #   NVSM 26.06 / NVVCT 1.0         : DGX-only "dgx" component, empty on the public repo.

