    # cuda13-gb300 — DGX OS 7.6.0 ARM64 stack: CUDA 13.0 U3 + R580 open driver
    # =========================================================================
    cuda13-gb300:
      install_environment:
        CUDA_PROFILE: cuda13-gb300
        CUDA_TOOLKIT_PACKAGE: cuda-toolkit-13-0
