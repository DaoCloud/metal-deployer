        version: 580.178.04-0ubuntu0.24.04.1
        required: true
        filename: nvidia-headless-no-dkms-580-server-open_580.178.04_arm64.deb
        install_method: apt
        group: gpu-driver
      - name: linux-modules-nvidia-580-server-open-nvidia-64k-hwe-24.04
        description: 签名 NVIDIA 580 open 内核模块元包（跟随 linux-nvidia-64k-hwe-24.04 内核）
        url: http://ports.ubuntu.com/ubuntu-ports/pool/restricted/l/linux-restricted-modules-nvidia-7.0/linux-modules-nvidia-580-server-open-nvidia-64k-hwe-24.04_7.0.0-1024.25~24.04.1_arm64.deb
        version: 7.0.0-1024.25~24.04.1
        required: true
        filename: linux-modules-nvidia-580-server-open-nvidia-64k-hwe-24.04_7.0.0-1024.25_arm64.deb
        install_method: apt
        group: gpu-driver
      - name: linux-modules-nvidia-580-server-open-7.0.0-1024-nvidia-64k
        description: 签名 NVIDIA 580 open 内核模块（nvidia.ko/nvidia-uvm/peermem,7.0.0-1024-nvidia-64k）
        url: http://ports.ubuntu.com/ubuntu-ports/pool/restricted/l/linux-restricted-signatures-nvidia-7.0/linux-modules-nvidia-580-server-open-7.0.0-1024-nvidia-64k_7.0.0-1024.25~24.04.1_arm64.deb
        version: 7.0.0-1024.25~24.04.1
        required: true
        filename: linux-modules-nvidia-580-server-open-7.0.0-1024-nvidia-64k_7.0.0-1024.25_arm64.deb
        install_method: apt
        group: gpu-driver
      # Not shipped: linux-objects-nvidia-580-server-open-<kver> and
