user_data:
  source: user-data
  autoinstall:
    apt:
      fallback: offline-install
      preserve_sources_list: false
      geoip: false
    codecs:
      install: false
    drivers:
      install: false
    kernel:
      # arm64 live-server pool only ships linux-generic. linux-nvidia-64k-hwe is
      # installed from the ISO local repo on first boot, followed by a reboot
      # (same sequence Canonical documents for GB200/GB300).
      package: linux-generic
    shutdown: reboot
    # Runs before disk probing. Checks which disk storage.layout.match selects and
    # stops the install if it is ambiguous or a USB disk. Kernel parameter
    # md.root_disk=<spec> replaces the match without rebuilding the ISO; see
    # scripts/select_root_disk.sh.
    early-commands:
    - bash /cdrom/resource/scripts/select_root_disk.sh
    updates: security
    locale: en_US.UTF-8
    timezone: Etc/UTC
    keyboard:
      layout: us
      variant: ''
    network:
      version: 2
      ethernets:
        default:
          match:
            name: e*
          dhcp4: true
          dhcp6: false
    storage:
      layout:
        name: direct
        # GB300 compute tray: 1 x M.2 NVMe OS drive (1.92/2 TB) + 4-8 x E1.S NVMe
        # data drives (3.84/4 TB). "largest" would install onto an E1.S drive.
        # "smallest" picks the M.2, matching the NICo image-install recommendation
        # (boot_disk: smallest). Override per site with md.root_disk=<spec>.
        match:
          size: smallest
    identity:
      hostname: gb300-node
      realname: admin
      username: admin
      password: "$6$tY22hWWMnPlGHjLQ$Oz16kbvmSDYccQVUiFBP5jlqRktAQVebHmEDcuhooC9Yh189GJ1L.VAQOJxwXkghejh9fVOc1l2piYJ2vWo0K0"
    ssh:
      install-server: true
      allow-pw: true
      authorized-keys: []
  installation:
    # Declarative view of the GB300 install sequence (documentation only; the
    # executed order lives in config/cloud-init/user-data and init_system.sh).
    # Single first boot: the platform kernel is installed during autoinstall,
    # so there is no kernel -> reboot -> driver split anymore.
    autoinstall_early_commands:
    - name: select_root_disk
      description: 安装阶段 early-commands 中执行 select_root_disk.sh：按 storage.layout.match（默认 size smallest，即 M.2）推算系统盘，USB/可移动盘或同容量不同型号的歧义时在分区前中止；内核参数 md.root_disk=<spec> 覆盖选盘规则，md.root_disk_check=0 关闭检查
      script: select_root_disk.sh
      enabled: true
      log: "/var/log/installer/metal-deployer-root-disk.log"
    autoinstall_late_commands:
    - name: nvidia_kernel
      description: 安装阶段 late-commands 中执行 install_target_kernel.sh：从 /opt/resource/packages 离线安装 linux-nvidia-64k-hwe-24.04（7.0.0-1024）并 hold,安装器重启后直接进入该内核
      script: install_target_kernel.sh
      enabled: true
      log: "/var/log/metal-deployer-target-kernel.log"
    boot1:
    - name: apt_sources
      description: 配置 APT 源（默认 local 离线仓库）
      script: configure-apt-sources.sh
      enabled: true
      log: "/var/log/apt-sources.log"
    - name: diagnostic_tools
      description: 安装系统诊断工具与构建链
      enabled: true
      log: "/var/log/diagnostic-tools.log"
    - name: kernel_check
      description: 确认运行内核为 KERNEL_RELEASE（7.0.0-1024-nvidia-64k）,否则 gpu_driver 阶段中止（签名模块只匹配该内核）
      command: uname -r | grep -q nvidia-64k
      enabled: true
    - name: dgx_system_tuning
      description: 安装 DGX 系统调优包（grub/sysctl/modprobe/modules-load）
      command: apt-get install -y --no-install-recommends nv-common-apis nvidia-grub-params nvidia-kernel-defaults nv-cpu-governor nvidia-disable-numa-balancing nvidia-disable-init-on-alloc nv-iommu nvidia-acs-disable nvidia-pci-bridge-power nvidia-relaxed-ordering-gpu nvidia-relaxed-ordering-nvme nvidia-nvme-options nv-limits nv-ipmi-devintf nv-persistence-mode nvidia-fs-loader nvidia-peermem-loader nvidia-ib-umad-loader nvidia-arm-cspmu-loader nvidia-sbsa-gwdt-options nvidia-cppc-cpufreq-options nvidia-earlycon nvidia-crashdump nvidia-logrotate nvgpu-services-list nvidia-chardev-links && update-grub
      enabled: true
      log: "/var/log/dgx-system-tuning.log"
    - name: apt_packages
      description: 安装本地仓库 deb（驱动 local repo、CUDA 13.0.3 local repo、容器工具等）
      enabled: true
      log: "/var/log/apt-install.log"
    - name: gpu_driver
      description: 安装 Canonical 签名 R580 server-open 580.178.04（预编译模块,无 DKMS）+ FM + NSCQ + IMEX + GDS tools 1.15 + DCGM 4.7.1 + NCCL 2.31.2
      command: apt-get install -y --no-install-recommends nvidia-headless-no-dkms-580-server-open nvidia-utils-580-server linux-modules-nvidia-580-server-open-nvidia-64k-hwe-24.04 nvidia-fabricmanager-580 libnvidia-nscq-580 nvidia-imex-580 nvidia-modprobe cuda-toolkit-13-0 gds-tools-13-0 libnccl2 libnccl-dev datacenter-gpu-manager-4-core datacenter-gpu-manager-4-proprietary datacenter-gpu-manager-4-cuda13 datacenter-gpu-manager-4-proprietary-cuda13
      enabled: true
      condition: "lspci -d 10de: | grep -qiE '3d|vga|display'"
      log: "/var/log/gpu-driver.log"
    - name: doca_install
      description: DOCA-OFED 3.2.3 LTS（mlnx-ofed-kernel-dkms 对 7.0.0-1024-nvidia-64k 编译）
      script: install_doca.sh
      enabled: true
      condition: lspci | grep -iE 'mellanox|connectx|bluefield'
      log: "/var/log/doca-install.log"
    - name: gdrcopy
      description: 安装 GDRCopy 2.6 预编译 deb（gdrdrv-dkms 在目标机编译）
      command: apt-get install -y --no-install-recommends gdrdrv-dkms libgdrapi gdrcopy gdrcopy-tests
      enabled: true
      log: "/var/log/gdrcopy.log"
    - name: test_tools_build
      description: 编译安装 RDMA/GPU 性能测试工具（nccl-tests、nvbandwidth -DMULTINODE=1、perftest、imex_fabric_ipc_test）
      script: install_test_tools.sh
      enabled: true
      condition: test -d /usr/local/cuda
      log: "/var/log/test-tools-build.log"
      timeout: 1800
    - name: gpu_burn_build
      description: 编译安装 GPU Burn
      script: install_gpu_burn.sh
      enabled: false
      condition: test -d /usr/local/cuda
      log: "/var/log/gpu-burn-build.log"
      timeout: 600
    - name: container_runtime
      description: 配置 containerd/docker + NVIDIA Container Runtime
      script: setup_container_runtime.sh
      enabled: true
      log: "/var/log/container-runtime.log"
    - name: docker_images
      description: 预加载 Docker 镜像 tar 包
      script: load_docker_images.sh
      enabled: true
      condition: test -d /opt/resource/packages/images
      log: "/var/log/docker-image-load.log"
    - name: rdma_modules
      description: 配置 /etc/rdma/modules/rdma.conf
      script: configure_rdma_modules.sh
      enabled: true
      log: "/var/log/rdma-modules.log"
    - name: ssh_keys
      description: 配置 SSH 公钥
      script: configure_ssh.sh
      enabled: true
      log: "/var/log/ssh-keys.log"
    - name: nvidia_config
      description: NVIDIA 驱动额外配置（Persistence Mode、nvidia-smi topo；IMEX 预置：channel0 modprobe、systemd drop-in、enable 但不启动；GB300 不启用 Fabric Manager）
      script: nvidia_setup.sh
      enabled: true
      log: "/var/log/nvidia-setup.log"
    # Day-2 (not run by the ISO): per rack, on every tray
    #   /opt/resource/scripts/imex-configure.sh --nodes /root/rackN.list
    #   /opt/resource/scripts/imex-check.sh
    #   /opt/resource/scripts/imex-bench.sh --nodes /root/rackN.list
    ignore_install_errors: false
    logging:
      base_dir: "/var/log/metal-deployer"
      summary_log: "/var/log/metal-deployer/install-summary.log"
