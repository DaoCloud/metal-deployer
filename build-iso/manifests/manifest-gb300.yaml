        install_method: apt
      - name: nccl-dev
        description: NVIDIA NCCL development headers 2.31.2（arm64/sbsa）
        url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/libnccl-dev_2.31.2-1+cuda13.3_arm64.deb
        version: 2.31.2
        required: true
        filename: libnccl-dev-2.31.2-ubuntu2404-cuda13.3_arm64.deb
        install_method: apt
      - name: cudnn
        description: NVIDIA cuDNN 9.24.0 for CUDA 13（DGX OS 7.6.0 对齐,arm64/sbsa,可选）
        url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/libcudnn9-cuda-13_9.24.0.43-1_arm64.deb
        version: 9.24.0.43
        required: false
        filename: libcudnn9-cuda-13-9.24.0.43-ubuntu2404_arm64.deb
        install_method: apt
      # GPUDirect Storage 1.15 for CUDA 13.0 (DGX OS 7.6.0 "GDS 1.15").
