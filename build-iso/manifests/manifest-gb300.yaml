        version: 580.178.04
        required: true
        filename: nvidia-modprobe-580.178.04-ubuntu2404_arm64.deb
        install_method: apt
        group: gpu-driver
      # Alternative (NOT default): NVIDIA's own driver local repo, unsigned
      # DKMS open modules. Only for Secure-Boot-off hosts that must track
      # NVIDIA packaging; mutually exclusive with the Canonical set above.
      - name: nvidia-driver-local-repo
        description: NVIDIA R580 driver local repo 580.178.04（arm64,DKMS 非签名；与 Canonical 签名集互斥,默认不下载）
