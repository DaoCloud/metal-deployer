# =============================================================================
# metal-deployer manifest — NVIDIA GB300 series (Grace Blackwell, ARM64/SBSA)
# =============================================================================
#
# PLATFORM : DGX GB300 / GB300 NVL72 / OEM MGX GB300 (Grace CPU + Blackwell Ultra)
# ARCH     : arm64 (aarch64, SBSA). NOT for DGX B300 (x86_64) — use manifest.yaml.
#
# VERSION ALIGNMENT SOURCE
#   https://docs.nvidia.com/dgx/dgx-os-7-user-guide/release_notes.html
#   Primary  : "DGX OS 7.6.0" ISO release set   (2026-09-14, Ubuntu 24.04.5)
#   Fallback : "Current Software Versions" table (2026-10-27) where the 7.6.0
#              artefact is not published as an offline-installable package.
#   Package names/filenames cross-checked against the public DGX OS apt repo:
#     https://repo.download.nvidia.com/baseos/ubuntu/noble/arm64/
#
# ALIGNMENT TABLE (DGX OS 7.6.0 ARM64 -> this manifest)
#   Component        DGX OS 7.6.0            This manifest            Note
#   OS base          Ubuntu 24.04.5          24.04.5 arm64            exact
#   Kernel           7.0.0-1018-nvidia-64k   7.0.0-1024-nvidia-64k    1018 superseded in archive; 1024 is current
#   GPU driver       580.178.04 (open)       580.178.04 server-open   exact; Canonical signed, prebuilt for nvidia-64k, no DKMS, Secure Boot OK
#   CUDA toolkit     13.0 Update 3           13.0.3                   exact (local repo bundles 580.126.20; driver pinned to 580.178.04)
#   DOCA-OFED        3.2.3-020000 LTS        3.2.3-019000 LTS         020000 has no offline doca-host deb; 019000 = "Current" table
#   NCCL             2.31.2                  2.31.2-1+cuda13.3        exact
#   cuDNN            9.24.0                  9.24.0.43                exact (optional)
#   DCGM             4.6.1                   4.7.1                    newer; complete CUDA 13 diagnostic package set + multinode (mndiag)
#   Container Toolkit 1.20.0                 1.20.0                   exact
#   Docker Engine    29.6.2                  29.6.2 (DGX repo build)  exact
#   GDRCopy          2.6                     2.6-1 (DGX repo arm64)   exact
#   GDS              1.15 (CUDA 13.0)        nvidia-fs signed module + libcufile (via cuda-toolkit) + gds-tools 1.15.1.6
#   NVSM / NVVCT     26.06.03 / 1.0.00-1     not shipped              DGX-only repo component, not publicly downloadable
#   MIG manager      0.15.0                  0.15.0                   exact (optional)
#   nvidia-system-*  2404.26.01              curated subset           DGX tuning debs, see dgx-system-tuning
#   HPC-X            (not in DGX OS)         NGC hpc-benchmarks:25.09 optional (download: false); nccl-tests need only Ubuntu openmpi
#   Containers       DLFW 26.07              cuda:13.0.3-runtime      smoke test; pytorch:26.09-py3 (12 GB) left out
#   SuperBench       (not in DGX OS)         superbench/main:cuda13.0 main@9142bdfe, digest-pinned, sm_103 build
#
# TOOLING STATUS FOR THIS MANIFEST
#   done prepare.sh : cross-arch offline package set. An isolated apt root (CI_WORK_DIR/apt-arm64,
#                     ports.ubuntu.com noble{,-updates,-security}) seeded with the base ISO's dpkg status
#                     solves ONE consistent install of: apt groups + KERNEL_PACKAGE + NVIDIA_DRIVER_PACKAGES
#                     + every directly downloaded deb + CUDA_TOOLKIT_PACKAGE (CUDA local repo indexed,
#                     its bundled 580.126.20 driver pinned out). Only the solution is downloaded; stale
#                     closure debs are pruned. docker_images[].platform / .digest / .download=false honoured.
#   done build.sh   : UEFI-only repack for arm64 (replays the source ISO's El Torito/ESP layout via
#                     xorriso -report_el_torito as_mkisofs), console=ttyAMA0 from SERIAL_CONSOLE,
#                     volume ID METAL-GB300-ARM64, /autoinstall.yaml (network boot / NICo) and
#                     /.metal-deployer/release.json (paths + boot hints for ISO-unpacking tooling)
#                     (verified 2026-11-05: QEMU aarch64 + AAVMF boots UEFI -> GRUB -> kernel -> casper)
#   done kernel     : no first-boot reboot. autoinstall late-commands run scripts/install_target_kernel.sh
#                     in the target, installing KERNEL_PACKAGE from /opt/resource/packages, so the first
#                     boot already runs 7.0.0-1024-nvidia-64k (verified in an arm64 chroot of the ISO rootfs)
#   done init_system.sh : NVIDIA_DRIVER_BRANCH=580-server-open-signed installs NVIDIA_DRIVER_PACKAGES verbatim,
#                     refuses to run on a kernel other than KERNEL_RELEASE, pins the CUDA local repo driver
#                     out; GPU detection by PCI vendor 10de + class 0300/0302 (GB300 may lack a pci.ids name)
#   done install_test_tools.sh : MPI home uses the multiarch path
#   todo test.sh    : qemu-system-aarch64 -M virt + AAVMF (manual QEMU run works, see build-iso/readme.md)
#   todo on hardware: driver load, IMEX, DOCA on a real GB300 tray
#
# Build (separate work dir keeps x86 caches intact):
#   CI_WORK_DIR=$PWD/build-iso/.ci-work/gb300 CACHE_BASE_DIR=$PWD/build-iso/.ci-work/gb300-cache \
#     make prepare-iso ISO_MANIFEST=build-iso/manifests/manifest-gb300.yaml CUDA_PROFILE=cuda13-gb300
#   sudo CI_WORK_DIR=$PWD/build-iso/.ci-work/gb300 \
#     make build-iso ISO_MANIFEST=build-iso/manifests/manifest-gb300.yaml CUDA_PROFILE=cuda13-gb300
#
# Backup profile cuda13-gb300-aggressive (R615 + CUDA 13.4 + DOCA 3.5, kernel 1025):
# see the comment above that profile under cuda.profiles.
# =============================================================================
