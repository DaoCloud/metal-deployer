version: v0.13
superbench:
  enable:
  - cpu-memory-bw-latency
  - cpu-hpl
  - disk-benchmark
  - gpu-copy-bw:perf
  - gpu-burn
  - ib-loopback:1G
  - nccl-bw:bw:allreduce:nvlink
  monitor:
    enable: true
    sample_duration: 1
    sample_interval: 10
  var:
    default_timeout: 600
    default_local_mode:
      modes:
      - name: local
        proc_num: 8
        prefix: CUDA_VISIBLE_DEVICES={proc_rank}
        parallel: true
    default_pytorch_mode:
      modes:
      - name: torch.distributed
        proc_num: 8
        node_num: 1
        env:
          NCCL_DEBUG: WARN
          NCCL_ASYNC_ERROR_HANDLING: '0'
      frameworks:
      - pytorch
    model_ddp_parameter:
      duration: 0
      num_warmup: 128
      num_steps: 512
      sample_count: 8192
      batch_size: 128
      precision:
      - float32
      - float16
      model_action:
      - train
      pin_memory: true
      num_workers: 0
    nccl_param:
      minbytes: 1
      maxbytes: 16G
      stepfactor: 2
      check: 1
      warmup_iters: 20
      iters: 100
      ngpus: 1
    nccl_graph_param:
      minbytes: 1
      maxbytes: 16G
      stepfactor: 2
      check: 1
      warmup_iters: 20
      iters: 100
      ngpus: 1
      graph_iters: 1
    default_nccl_mode:
      enable: true
      timeout: 600
      modes:
      - name: mpi
        proc_num: 8
        node_num: 1
        env:
          NCCL_DEBUG: DEBUG
          NCCL_NVLS_ENABLE: '0'
          CUBLASLT_LOG_LEVEL: '1'
    nccl_sharp_mode:
      enable: true
      timeout: 600
      modes:
      - name: mpi
        proc_num: 8
        node_num: 1
        env:
          NCCL_DEBUG: DEBUG
          NCCL_NVLS_ENABLE: '1'
    nccl_env:
      NCCL_IB_PCI_RELAXED_ORDERING: '1'
      NCCL_NET_GDR_LEVEL: '5'
      NCCL_DEBUG: WARN
      NCCL_SOCKET_IFNAME: eth0
    default_dist_inference_param:
      num_layers: 50
      num_warmup: 20
      num_steps: 100
      use_cuda_graph: true
      tune_gemm: true
    default_dist_inference_mode:
      enable: true
      timeout: 600
      modes:
      - name: mpi
        proc_num: 8
        node_num: 1
        env:
          NCCL_DEBUG: DEBUG
          NCCL_NVLS_ENABLE: '1'
      frameworks:
      - pytorch
  benchmarks:
    kernel-launch:
      modes:
      - name: local
        proc_num: 8
        prefix: CUDA_VISIBLE_DEVICES={proc_rank}
        parallel: true
        env: {}
      timeout: 600
    gemm-flops:
      modes:
      - name: local
        proc_num: 8
        prefix: CUDA_VISIBLE_DEVICES={proc_rank}
        parallel: true
        env: {}
      timeout: 1500
    gpu-burn:
      timeout: 1800
      modes:
      - name: local
        parallel: false
        env: {}
        proc_num: 1
        prefix: ''
      parameters:
        time: 900
        doubles: true
        tensor_core: true
    disk-benchmark:
      modes:
      - name: local
        proc_num: 1
        parallel: false
      parameters:
        block_devices:
        - /dev/nvme0n1
        seq_read_ramp_time: 10
        seq_read_runtime: 60
        seq_read_iodepth: 64
        seq_read_numjobs: 1
        seq_write_ramp_time: 10
        seq_write_runtime: 60
        seq_write_iodepth: 64
        seq_write_numjobs: 1
        rand_read_ramp_time: 10
        rand_read_runtime: 60
        rand_read_iodepth: 64
        rand_read_numjobs: 4
        rand_write_ramp_time: 10
        rand_write_runtime: 60
        rand_write_iodepth: 64
        rand_write_numjobs: 4
    cpu-hpl:
      modes:
      - name: local
        proc_num: 1
        parallel: false
      timeout: 3600
    cpu-memory-bw-latency:
      timeout: 600
      modes:
      - name: local
        parallel: false
        env: {}
        proc_num: 1
        prefix: ''
      parameters:
        tests:
        - bandwidth_matrix
        - latency_matrix
        - max_bandwidth
    gpu-copy-bw:perf:
      timeout: 7200
      modes:
      - name: local
        parallel: false
        env: {}
        proc_num: 1
        prefix: ''
      parameters:
        mem_type:
        - htod
        - dtoh
        - dtod
        - one_to_all
        - all_to_one
        - all_to_all
        copy_type:
        - sm
        - dma
        size: 67645734912
        num_warm_up: 1
        num_loops: 1
    ib-loopback:1G:
      timeout: 6000
      modes:
      - name: local
        proc_num: 2
        prefix: PROC_RANK={proc_rank} IB_DEVICES=0,4 NUMA_NODES=0,1
        parallel: true
        env: {}
      - name: local
        proc_num: 2
        prefix: PROC_RANK={proc_rank} IB_DEVICES=1,5 NUMA_NODES=0,1
        parallel: true
        env: {}
      - name: local
        proc_num: 2
        prefix: PROC_RANK={proc_rank} IB_DEVICES=2,6 NUMA_NODES=0,1
        parallel: true
        env: {}
      - name: local
        proc_num: 2
        prefix: PROC_RANK={proc_rank} IB_DEVICES=3,7 NUMA_NODES=0,1
        parallel: true
        env: {}
      parameters:
        msg_size: 1073741824
    nccl-bw:bw:allreduce:nvlink:
      enable: true
      timeout: 600
      modes:
      - name: mpi
        proc_num: 8
        node_num: 1
        env:
          NCCL_DEBUG: DEBUG
          NCCL_NVLS_ENABLE: '0'
          CUBLASLT_LOG_LEVEL: '1'
          PATH: null
          LD_LIBRARY_PATH: null
          SB_MICRO_PATH: null
          SB_WORKSPACE: null
        mca:
          pml: ob1
          btl: ^openib
          btl_tcp_if_exclude: lo,docker0
          coll_hcoll_enable: 0
      parameters:
        minbytes: 1
        maxbytes: 16G
        stepfactor: 2
        check: 1
        warmup_iters: 20
        iters: 100
        ngpus: 1
        operation: allreduce
        in_place: true
        data_type: half
    nccl-bw:lat:allreduce:nvlink:
      enable: true
      timeout: 600
      modes:
      - name: mpi
        proc_num: 8
        node_num: 1
        env:
          NCCL_DEBUG: DEBUG
          NCCL_NVLS_ENABLE: '0'
          CUBLASLT_LOG_LEVEL: '1'
          PATH: null
          LD_LIBRARY_PATH: null
          SB_MICRO_PATH: null
          SB_WORKSPACE: null
        mca:
          pml: ob1
          btl: ^openib
          btl_tcp_if_exclude: lo,docker0
          coll_hcoll_enable: 0
      parameters:
        minbytes: 1
        maxbytes: 1G
        stepfactor: 2
        check: 1
        warmup_iters: 20
        iters: 1000
        ngpus: 1
        operation: allreduce
        in_place: true
        data_type: half
